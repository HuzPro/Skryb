[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetotext"
version = "0.1.0"
description = "Local voice-to-text with HuggingFace Whisper (PyTorch) — CUDA/ROCm/CPU"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.36.0",
    "torch>=2.2.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "PySide6>=6.6.0",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
voicetotext = "voicetotext.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: fast hermetic tests, no I/O",
    "acceptance: full-use-case scenarios via fakes",
    "integration: touch real filesystem or real third-party libs",
    "slow: tests that take longer than 100ms",
]
filterwarnings = [
    "error",
]

[tool.setuptools.packages.find]
where = ["."]
