[build-system]
# setuptools >= 77 understands the PEP 639 SPDX `license` string below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetotext"
version = "0.1.0"
description = "Local voice-to-text with Parakeet and Nemotron - CUDA/ROCm/CPU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE"]
authors = [{ name = "Huzaifa Tatari", email = "huzaifa.tatari@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    # 2.5 is the PyTorch floor transformers 5.16 documents.
    "torch>=2.5",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    # Tkinter (stdlib) drives the GUI; Pillow only renders the tray icon
    # circle. Both are permissive (PSF / MIT), unlike the LGPL PySide6
    # they replaced.
    "Pillow>=10.0.0",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
    "nano-parakeet>=0.2.1",
    # Transformers engines: GraniteSpeech5ForCTC landed in 5.16.0 (the
    # highest floor; Qwen3-ASR needs 5.13, ARK-ASR 4.57.6, CrisperWhisper
    # 4.40), and the upper bound keeps a future major out until an engine
    # is tested against it. librosa and soundfile are imported by ARK's
    # remote processing code; torchaudio feeds Granite's log-mel feature
    # extractor.
    "transformers>=5.16.0,<6",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "torchaudio>=2.5",
    "text2num>=3.1",
    "jellyfish>=1.0",
]

[project.optional-dependencies]
punct = ["sherpa-onnx>=1.10"]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
]

[project.scripts]
voicetotext = "voicetotext.__main__:main"

[project.gui-scripts]
voicetotext-gui = "voicetotext.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is deselected by default because model benchmarks can exhaust the
# Windows pagefile. Opt in explicitly with `pytest -m slow`.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow",
]
markers = [
    "unit: fast hermetic tests, no I/O",
    "acceptance: full-use-case scenarios via fakes",
    "integration: touch real filesystem or real third-party libs",
    "slow: tests that take longer than 100ms (deselected by default; opt in via `-m slow`)",
    "performance: model performance benchmarks (very slow; opt in via `-m performance` and VOICETOTEXT_RUN_PERFORMANCE_TESTS=1)",
]
filterwarnings = ["error"]

# Only the application package ships in the wheel. Without an explicit
# include, find() crawls the whole tree (venv, tests, release) and the
# wheel build errors on the flat layout.
[tool.setuptools.packages.find]
include = ["voicetotext*"]

# The gated-model licence texts are runtime resources: the app displays
# them and hashes them to record consent. Undeclared, they would be
# absent from the installed wheel and the gate would have no terms to
# show.
[tool.setuptools.package-data]
voicetotext = ["licenses/*.md"]
