[build-system]
# setuptools >= 77 understands the PEP 639 SPDX `license` string below.
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skryb"
version = "0.5.1"
description = "Local, offline speech-to-text dictation for Windows on NVIDIA, AMD or CPU"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE"]
authors = [{ name = "Huzaifa Tatari", email = "huzaifa.tatari@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    # 2.5 is the PyTorch floor transformers 5.16 documents.
    "torch>=2.5",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    # Tkinter (stdlib) drives the GUI; Pillow only renders the tray icon
    # circle. Both are permissive (PSF / MIT), unlike the LGPL PySide6
    # they replaced.
    "Pillow>=10.0.0",
    "huggingface-hub>=0.20.0",
    "requests>=2.31.0",
    "nano-parakeet>=0.2.1",
    # 5.18.0 is the first release with Nemotron 3 Diarization, which meetings
    # use to tell speakers apart; CrisperWhisper only needs 4.40. The upper
    # bound keeps a future major out until tested. torchaudio is the decode
    # backend transformers' audio loader uses.
    "transformers>=5.18.0,<6",
    # Whisper prompt building and decoding go straight to the Rust
    # tokenizer, so no engine has to import Transformers for them.
    "tokenizers>=0.23.1",
    "torchaudio>=2.5",
    "text2num>=3.1",
    "jellyfish>=1.0",
    # UI Automation client for reading the text around the caret in
    # the focused window. Pure Python over ctypes, MIT licensed.
    "comtypes>=1.4",
    # Per-app volume (Core Audio sessions) for lowering other apps while
    # recording. MIT licensed, over comtypes.
    "pycaw>=20240210; sys_platform == 'win32'",
    # Phonon-2's CPU engine (Apache-2.0). Pinned exactly: the app calls its
    # internals. Its native libraries were audited at 0.2.11; 0.2.15
    # changed two Windows DLLs, checked the same way (same imports, no URLs).
    "fermion-research==0.2.15",
    # Counts physical cores for Phonon-2's thread count. pycaw already
    # pulls it in; listed because the app now imports it directly.
    "psutil>=5.9; sys_platform == 'win32'",
    # Meetings record what the PC plays through WASAPI loopback, which only
    # this PortAudio build exposes (Apache-2.0, PortAudio itself MIT).
    "PyAudioWPatch>=0.2.12.9; sys_platform == 'win32'",
    # Silero speech detection for the meeting microphone (MIT); its model
    # files ship inside the package.
    "silero-vad>=6.2",
    # Writes each meeting's them.flac and me.flac (BSD-3). nano-parakeet
    # already pulls it in; listed because the app now imports it directly.
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
punct = ["sherpa-onnx>=1.10"]
# CTranslate2 runs CrisperWhisper without importing transformers, which is
# the difference between a 15.5 s and a 3.4 s launch. PyPI publishes only
# the CPU/CUDA build; AMD GPUs need the ROCm wheel from CTranslate2's
# GitHub release, which is on no index and carries the same version
# number, so this extra cannot express it. See INSTALL.md.
ct2 = ["ctranslate2>=4.8.2,<5"]
# Runs the Parakeet encoder on an Intel NPU (Core Ultra, Core Series 3).
# 2026.1 is the first release that knows Wildcat Lake's NPU.
npu = ["openvino>=2026.1"]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
]

[project.scripts]
skryb = "skryb.__main__:main"

[project.gui-scripts]
skryb-gui = "skryb.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is deselected by default because model benchmarks can exhaust the
# Windows pagefile. Opt in explicitly with `pytest -m slow`.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow",
]
markers = [
    "unit: fast hermetic tests, no I/O",
    "acceptance: full-use-case scenarios via fakes",
    "integration: touch real filesystem or real third-party libs",
    "slow: tests that take longer than 100ms (deselected by default; opt in via `-m slow`)",
    "performance: model performance benchmarks (very slow; opt in via `-m performance` and SKRYB_RUN_PERFORMANCE_TESTS=1)",
]
filterwarnings = ["error"]

# Only the application package ships in the wheel. Without an explicit
# include, find() crawls the whole tree (venv, tests, release) and the
# wheel build errors on the flat layout.
[tool.setuptools.packages.find]
include = ["skryb*"]

# The gated-model licence texts are runtime resources: the app displays
# them and hashes them to record consent. Undeclared, they would be
# absent from the installed wheel and the gate would have no terms to
# show. ui-bin/ holds the settings window exe, which only the installer
# build puts there.
[tool.setuptools.package-data]
skryb = ["licenses/*.md", "ui-bin/*.exe", "transcription/qasr.dll", "transcription/npk.dll"]
