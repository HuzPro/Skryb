name: Release

# Releases are driven by the merge/commit message, not a button and not by
# every push. A push to `main` whose head-commit message opens with
# `release:` and a version (e.g. `release: v0.2.0`) builds the installer,
# tags `v0.2.0`, and publishes it. Every other push runs only the cheap
# gate job and stops. `workflow_dispatch` is an escape hatch for re-runs.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0). Blank = pyproject.toml."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The commit message is parsed by the unit-tested Python gate, not a
      # shell regex, and passed through an env var (never interpolated into
      # the script) so a crafted message cannot inject shell.
      - id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
            if [ -z "$version" ]; then
              version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: releasing $version."
            exit 0
          fi
          if version="$(python -m release.release_request "$HEAD_COMMIT_MESSAGE")"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Release commit detected: releasing $version."
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Head commit is not a release request; nothing to do."
          fi

      # The installed app reports pyproject.toml's version. A release tagged
      # anything else would have the app's updater offer it forever.
      - name: Check the version matches pyproject.toml
        if: steps.decide.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: python -c "import os, pathlib; from release.version import resolve_version; resolve_version(os.environ['VERSION'], pathlib.Path('pyproject.toml'))"

  test:
    name: Tests (Ubuntu, CPU)
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    # Pinned: on ubuntu-26.04 PortAudio can't reach the audio server, and importing
    # sounddevice fails test collection.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libsndfile1 xvfb xauth

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -e ".[dev,npu]"

      - name: Run tests
        run: xvfb-run -a python -m pytest -q

  build:
    name: Build installer
    needs: [gate, test]
    if: needs.gate.outputs.should_release == 'true'
    # Pinned, not windows-latest: Visual Studio 2026's C++ library made <cmath>
    # constexpr, and ROCm 7.2.1's HIP compiler then rejects its own GPU math
    # overloads ("__device__ function cannot overload __host__ __device__").
    # Visual Studio 2022 predates that change.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # The settings window (Tauri) ships inside the app wheel, and the
      # installer build refuses to run without it. Rust comes with the runner.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build settings window
        shell: pwsh
        run: ./scripts/build_ui.ps1

      # The native engines (qasr.dll for Qwen3-ASR, npk.dll for Parakeet, cw.dll for CrisperWhisper, nd.dll for
      # the meeting diarizer; gfx1200) ship inside the app
      # wheel too, and the installer build refuses to run without it. AMD's
      # ROCm SDK wheels carry hipcc, clang and the HIP headers; the runner's
      # Visual Studio supplies the C runtime headers. Compiling needs no GPU.
      - name: Build native engines
        shell: bash
        run: |
          python -m pip install --no-deps --find-links https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/ rocm-sdk-core==7.2.1 rocm-sdk-devel==7.2.1
          bash native/engine/build.sh
          bash native/parakeet/build.sh
          bash native/whisper/build.sh
          bash native/diar/build.sh

      # Their NVIDIA builds (qasr_cuda.dll and the rest, for the RTX 30-50 series) from the same sources:
      # nvcc and the CUDA runtime from NVIDIA's redistributable archives, and the runner's Visual Studio. No GPU.
      - name: Build native engines for NVIDIA
        shell: bash
        run: |
          python native/cuda/fetch_toolkit.py
          python native/cuda/build.py

      # Bundle a relocatable CPython 3.12 (python-build-standalone). AMD's
      # Windows ROCm wheels are cp312-only, so the bundled runtime is 3.12.
      - name: Fetch standalone CPython 3.12
        id: cpython
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "skryb-release" }
          $release = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match 'cpython-3\.12\.\d+\+.*-x86_64-pc-windows-msvc-install_only\.tar\.gz$' } |
            Select-Object -First 1
          if (-not $asset) { throw "No cp312 install_only Windows asset found in the latest release." }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile cpython.tar.gz
          New-Item -ItemType Directory -Force -Path cpython | Out-Null
          tar -xzf cpython.tar.gz -C cpython
          # The archive extracts to a top-level `python/` directory.
          "dir=$(Resolve-Path cpython\python)" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python build_installer.py --python-dir "${{ steps.cpython.outputs.dir }}" --version "${{ needs.gate.outputs.version }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skryb-Setup
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Skryb-Setup
          merge-multiple: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The installed app finds new versions through this file, not GitHub's
      # rate-limited API.
      - name: Describe the release for the app's updater
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: python -m release.latest_manifest "$VERSION" artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: Skryb v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/latest.json
          body: |
            Skryb v${{ needs.gate.outputs.version }} for Windows x64.

            Run the installer. It detects your GPU and lets you choose a
            runtime (NVIDIA CUDA / AMD ROCm / CPU); the matching PyTorch
            build is downloaded during installation, so this download stays
            small. After install, run `skryb` from any terminal or
            launch it from the Start Menu. Speech-to-text models download on
            first run.

            Skryb installs for your Windows account only, so setup never asks
            for admin rights. Once installed, it checks GitHub for new versions
            and offers to install each one itself, so this is the only download
            you do by hand. Turn the checks off in Settings > Updates.

            The installer is not code-signed yet, so Windows SmartScreen may
            say it "protected your PC". Click **More info**, then **Run
            anyway**.

            Third-party license notices are written to the install folder
            (`THIRD-PARTY-NOTICES.txt`) and `NOTICE.txt` covers the bundled
            Python runtime.
