name: LTO measurement (temporary)

on:
  push:
    branches: [ci/faster-builds]
    paths: [.github/workflows/lto-measure.yml]

permissions:
  contents: read

jobs:
  measure:
    name: crate extraction on ${{ matrix.home }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        home: ["C:/Users/runneradmin/.cargo", "D:/cargo-home"]
    env:
      CARGO_HOME: ${{ matrix.home }}
    steps:
      - uses: actions/checkout@v5
      - name: cpu
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name | Format-List
      - name: download the crates
        shell: bash
        run: time cargo fetch --manifest-path ui/src-tauri/Cargo.toml
      - name: extract the crate sources
        shell: bash
        run: time cargo metadata --format-version 1 --manifest-path ui/src-tauri/Cargo.toml > /dev/null
      - name: write and read a 1 GB file
        shell: bash
        run: |
          time dd if=/dev/zero of=big.bin bs=1M count=1024
          time cat big.bin > /dev/null
