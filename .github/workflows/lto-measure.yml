name: LTO measurement (temporary)

on:
  push:
    branches: [ci/faster-builds]
    paths: [.github/workflows/lto-measure.yml]

permissions:
  contents: read

jobs:
  measure:
    name: restored cache, build twice (${{ matrix.n }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        n: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - id: cargo-key
        shell: bash
        run: |
          echo "key=cargo-${{ runner.os }}-rust$(rustc -V | cut -d' ' -f2)-${{ hashFiles('ui/src-tauri/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
          wmic cpu get name || true
          powershell -c "(Get-CimInstance Win32_Processor).Name"
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ui/src-tauri/target
          key: ${{ steps.cargo-key.outputs.key }}
      - name: first build after restore
        shell: pwsh
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pnpm tauri build
          Write-Host "first $($sw.Elapsed.TotalSeconds)s"
      - name: second build after a frontend change
        shell: pwsh
        working-directory: ui
        run: |
          Add-Content src/main.tsx "// changed"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pnpm tauri build
          Write-Host "second $($sw.Elapsed.TotalSeconds)s"
