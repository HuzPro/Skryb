name: LTO measurement (temporary)

on:
  push:
    branches: [ci/faster-builds]
    paths: [.github/workflows/lto-measure.yml]

permissions:
  contents: read

jobs:
  measure:
    name: lto=${{ matrix.lto }} cgu=${{ matrix.cgu }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lto: "true", cgu: "1" }
          - { lto: "true", cgu: "16" }
          - { lto: "thin", cgu: "1" }
          - { lto: "thin", cgu: "16" }
          - { lto: "false", cgu: "16" }
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.cgu }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: cold build
        shell: pwsh
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build
          Write-Host "size $((Get-Item src-tauri/target/release/skryb-ui.exe).Length)"
      - name: rebuild after a frontend change
        shell: pwsh
        working-directory: ui
        run: |
          Add-Content src/main.tsx "// changed"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pnpm tauri build
          Write-Host "incremental $($sw.Elapsed.TotalSeconds)s size $((Get-Item src-tauri/target/release/skryb-ui.exe).Length)"
