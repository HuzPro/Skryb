name: LTO measurement (temporary)

on:
  push:
    branches: [ci/faster-builds]
    paths: [.github/workflows/lto-measure.yml]

permissions:
  contents: read

jobs:
  measure:
    name: restored cache (${{ matrix.variant }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [registry-cache, registry-src]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - id: cargo-key
        shell: bash
        run: echo "key=cargo-${{ runner.os }}-rust$(rustc -V | cut -d' ' -f2)-${{ hashFiles('ui/src-tauri/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
      - if: matrix.variant == 'registry-cache'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ui/src-tauri/target
          key: ${{ steps.cargo-key.outputs.key }}
      - if: matrix.variant == 'registry-src'
        id: src
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ui/src-tauri/target
          key: ${{ steps.cargo-key.outputs.key }}-src
          restore-keys: ${{ steps.cargo-key.outputs.key }}
      - name: extract the crate sources
        shell: bash
        run: time cargo metadata --format-version 1 --manifest-path ui/src-tauri/Cargo.toml > /dev/null
      - name: first build after restore
        shell: pwsh
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          Add-Content src/main.tsx "// changed"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pnpm tauri build
          Write-Host "first $($sw.Elapsed.TotalSeconds)s"
          git checkout src/main.tsx
      - if: matrix.variant == 'registry-src' && steps.src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ui/src-tauri/target
          key: ${{ steps.cargo-key.outputs.key }}-src
