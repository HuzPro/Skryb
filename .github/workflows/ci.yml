name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      salt:
        description: "measurement: busts the build caches"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
        n: ["auto", "6"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install system libraries (no update)
        run: |
          time sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1 xvfb xauth || echo "NEEDS UPDATE"
      - name: Install Python dependencies
        run: |
          uv pip install --system --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          uv pip install --system -e ".[dev,npu]" pytest-xdist
      - run: python native/tdt/build.py
      - name: Run tests
        run: |
          /usr/bin/time -v xvfb-run -a python -m pytest -q -n ${{ matrix.n }} --dist worksteal 2> time.txt; tail -25 time.txt | head -12

  ui:
    name: Settings window
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: key timing
        shell: bash
        run: |
          time rustc -V
          time rustc -V
          time ls ~/.rustup/toolchains
      - id: key
        shell: bash
        run: echo "exe=ui-exe-$(rustc -V | cut -d' ' -f2)-node22-${{ hashFiles('ui/**') }}-${{ inputs.salt }}" >> "$GITHUB_OUTPUT"
      - id: exe
        uses: actions/cache/restore@v4
        with:
          path: ui/src-tauri/target/release/skryb-ui.exe
          key: ${{ steps.key.outputs.exe }}
      - if: steps.exe.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - if: steps.exe.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - if: steps.exe.outputs.cache-hit != 'true'
        id: cargo-key
        shell: bash
        run: echo "key=cargo-${{ runner.os }}-$(rustc -V | cut -d' ' -f2)-${{ hashFiles('ui/src-tauri/Cargo.lock') }}" >> "$GITHUB_OUTPUT"
      - if: steps.exe.outputs.cache-hit != 'true'
        id: cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ui/src-tauri/target
          key: ${{ steps.cargo-key.outputs.key }}
      - if: steps.exe.outputs.cache-hit != 'true'
        name: pnpm install
        shell: pwsh
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - if: steps.exe.outputs.cache-hit != 'true'
        name: frontend
        shell: pwsh
        working-directory: ui
        run: pnpm build
      - if: steps.exe.outputs.cache-hit != 'true'
        name: Build settings window
        shell: pwsh
        working-directory: ui
        run: pnpm tauri build -v 2>&1 | Select-String -Pattern "Compiling|Fresh|Finished|Running.*skryb" | Select-Object -First 400
      - if: steps.exe.outputs.cache-hit != 'true' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ui/src-tauri/target
          key: ${{ steps.cargo-key.outputs.key }}
      - if: steps.exe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ui/src-tauri/target/release/skryb-ui.exe
          key: ${{ steps.key.outputs.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ui/src-tauri/target/release/skryb-ui.exe
          if-no-files-found: error
          retention-days: 1

  rocm:
    name: Native engines (AMD)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: key
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          "key=native-rocm-7.2.1-vs$vs-${{ hashFiles('native/engine/**', 'native/parakeet/**', 'native/diar/**') }}-${{ inputs.salt }}" >> $env:GITHUB_OUTPUT
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            native/engine/build/qasr.dll
            native/parakeet/build/npk.dll
            native/diar/build/nd.dll
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: ROCm SDK
        shell: bash
        run: python -m pip install --no-deps --find-links https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/ rocm-sdk-core==7.2.1
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build
        shell: bash
        run: |
          pids=()
          for engine in engine parakeet diar; do bash native/$engine/build.sh > $engine.log 2>&1 & pids+=($!); done
          for pid in "${pids[@]}"; do wait $pid; done
          tail -n 1 engine.log parakeet.log diar.log
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            native/engine/build/qasr.dll
            native/parakeet/build/npk.dll
            native/diar/build/nd.dll
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: rocm
          path: |
            native/engine/build/qasr.dll
            native/parakeet/build/npk.dll
            native/diar/build/nd.dll
          if-no-files-found: error
          retention-days: 1

  cuda:
    name: Native engines (NVIDIA, ${{ matrix.engine }})
    runs-on: windows-2022
    strategy:
      matrix:
        engine: [engine, parakeet, diar]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: build
        shell: bash
        run: |
          time python native/cuda/fetch_toolkit.py
          time python native/cuda/build.py ${{ matrix.engine }} > /dev/null 2>&1

  installer:
    name: Installer
    needs: [ui, rocm]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ui
          path: ui/src-tauri/target/release
      - uses: actions/download-artifact@v4
        with:
          name: rocm
          path: native
      - name: stand-in CUDA dlls (measurement only)
        shell: bash
        run: for d in engine/build/qasr parakeet/build/npk diar/build/nd; do cp native/$d.dll native/${d}_cuda.dll; done
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the CPU TDT decoder
        run: python native/tdt/build.py
      - name: Fetch standalone CPython 3.12
        id: cpython
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "skryb-release" }
          $release = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/astral-sh/python-build-standalone/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match 'cpython-3\.12\.\d+\+.*-x86_64-pc-windows-msvc-install_only\.tar\.gz$' } |
            Select-Object -First 1
          if (-not $asset) { throw "No cp312 install_only Windows asset found in the latest release." }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile cpython.tar.gz
          New-Item -ItemType Directory -Force -Path cpython | Out-Null
          tar -xzf cpython.tar.gz -C cpython
          "dir=$(Resolve-Path cpython\python)" >> $env:GITHUB_OUTPUT
      - name: Build installer
        shell: pwsh
        run: python build_installer.py --python-dir "${{ steps.cpython.outputs.dir }}"
      - name: ISCC variants (measurement only)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $wheel = (Get-ChildItem build/installer-payload/wheels/*.whl).Name
          $base = Get-Content installer/Skryb.iss -Raw
          foreach ($v in @("", "LZMANumBlockThreads=4", "LZMAUseSeparateProcess=yes", "LZMAUseSeparateProcess=yes`r`nLZMANumBlockThreads=4")) {
            $text = $base -replace "SolidCompression=yes", "SolidCompression=yes`r`n$v"
            Set-Content installer/variant.iss $text
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & $iscc /Q "/DAppVersion=0.13.0" "/DPayloadDir=$PWD\build\installer-payload" "/DWheelFile=$wheel" "/DReqCuda=requirements-nvidia.txt" "/DReqRocm=requirements-amd.txt" "/DReqCpu=requirements-cpu.txt" "/O$PWD\variant" "/Fv" installer/variant.iss
            Write-Host "variant [$v]: $($sw.Elapsed.TotalSeconds)s size $((Get-Item variant/v.exe).Length)"
          }
