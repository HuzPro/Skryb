name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Ubuntu, CPU, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, xdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Which system libraries are already there
        run: |
          nproc; free -g
          for p in libportaudio2 libsndfile1 xvfb xauth; do dpkg -s $p >/dev/null 2>&1 && echo "$p present" || echo "$p MISSING"; done

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libsndfile1 \
            xvfb xauth

      - name: Install Python dependencies
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          uv pip install -e ".[dev,npu]" pytest-xdist

      - name: Build the CPU TDT decoder
        run: python native/tdt/build.py

      - name: Time imports and collection
        run: |
          python -X importtime -c "import skryb" 2> importtime.txt; sort -t'|' -k2 -n importtime.txt | tail -15
          time python -m pytest -q --collect-only > /dev/null

      - name: Run tests
        run: |
          if [ "${{ matrix.mode }}" = xdist ]; then extra="-n auto"; else extra=""; fi
          xvfb-run -a python -m pytest -q --durations=60 $extra
