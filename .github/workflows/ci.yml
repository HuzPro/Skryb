name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref supersede in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Ubuntu, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # System libraries the suite pulls in at import time on Linux:
      #   libportaudio2 -> sounddevice (recording adapter)
      #   libsndfile1   -> soundfile (audio test dep)
      #   xvfb + xauth  -> virtual X display for the Tkinter widget tests
      #                    (the native Win32 modules are excluded on Linux)
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libsndfile1 \
            xvfb xauth

      # CPU PyTorch from the dedicated index (skips the large CUDA wheels),
      # then the project with its test deps and the parakeet engine (the
      # cache-aware streaming tests import nano_parakeet directly).
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -e ".[dev,parakeet]"

      # `python -m pytest` puts the repo root on sys.path (the `tests`
      # package imports need it). `-m "not slow"` (pyproject.toml addopts)
      # and the Windows-only module exclusions (tests/conftest.py) apply
      # automatically.
      - name: Run tests
        run: xvfb-run -a python -m pytest -q
