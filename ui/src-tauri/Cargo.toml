[package]
name = "skryb-ui"
version = "0.1.0"
description = "Skryb settings and history window"
edition = "2021"
publish = false
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

[features]
# `pnpm tauri build` turns this on; a bare `cargo build` without it loads the dev server URL.
custom-protocol = ["tauri/custom-protocol"]
# Fallback: the system title bar instead of the drawn one.
native-titlebar = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
